<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fruit Ninja — Hand Edition</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#000;
  display:flex; align-items:center; justify-content:center;
  height:100vh; overflow:hidden;
  font-family:'Press Start 2P',monospace;
}
#wrap {
  position:relative; width:900px; height:600px;
  overflow:hidden; border:3px solid #5a3a1a;
  box-shadow:0 0 60px rgba(0,0,0,0.9);
  cursor:none;
}
#bg-canvas { position:absolute; inset:0; width:100%; height:100%; }
#game-canvas { position:absolute; inset:0; width:100%; height:100%; }
#trail-canvas { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
#cam-wrap {
  position:absolute; bottom:8px; right:8px;
  width:110px; height:82px; border:2px solid #3a2a0a;
  overflow:hidden; opacity:0.75; z-index:20;
}
#cam-video { width:100%; height:100%; object-fit:cover; transform:scaleX(-1); display:block; }
#hand-canvas { position:absolute; inset:0; width:100%; height:100%; transform:scaleX(-1); }
#hud {
  position:absolute; top:0; left:0; right:0; padding:8px 12px;
  display:flex; justify-content:space-between; align-items:center;
  background:rgba(0,0,0,0.55); z-index:15;
}
#hud span { color:#f8d060; font-size:9px; text-shadow:2px 2px 0 #000; }
.life { display:inline-block; color:#e03030; font-size:11px; margin-left:3px; }
#overlay {
  position:absolute; inset:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:rgba(0,0,0,0.82); z-index:30; gap:14px;
}
#overlay h1 { color:#f8d060; font-size:22px; text-shadow:3px 3px 0 #b84000; }
#overlay p { color:#ddd; font-size:9px; text-align:center; line-height:2.2; }
#overlay .sub { color:#aaa; font-size:8px; text-align:center; line-height:2; }
#start-btn {
  padding:12px 28px; background:#b84000; color:#fff;
  border:3px solid #f8d060; font-family:'Press Start 2P',monospace;
  font-size:9px; cursor:pointer; box-shadow:4px 4px 0 #000;
  transition:transform .1s, box-shadow .1s; margin-top:8px;
}
#start-btn:hover { transform:translate(2px,2px); box-shadow:2px 2px 0 #000; }
#round-flash {
  position:absolute; inset:0;
  display:none; align-items:center; justify-content:center;
  background:rgba(0,0,0,0.7); z-index:25;
}
#round-flash h2 { color:#f8d060; font-size:24px; text-shadow:3px 3px 0 #b84000; animation:pop .4s ease-out; }
@keyframes pop { from{transform:scale(0.4);opacity:0} to{transform:scale(1);opacity:1} }
.score-pop {
  position:absolute; color:#f8d060; font-family:'Press Start 2P',monospace;
  font-size:10px; text-shadow:2px 2px 0 #000; pointer-events:none;
  z-index:20; animation:sfloat .7s ease-out forwards;
}
@keyframes sfloat { 0%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(-50px)} }
#combo-display {
  position:absolute; top:40px; left:50%; transform:translateX(-50%);
  z-index:18; pointer-events:none;
}
#combo-text {
  color:#ff6600; font-size:14px; text-shadow:0 0 10px #ff6600, 2px 2px 0 #000;
  display:none; animation:comboPop .5s ease-out;
}
@keyframes comboPop { from{transform:scale(0.5) translateX(-50%);opacity:0} to{transform:scale(1) translateX(-50%);opacity:1} }
#cam-status { position:absolute; top:28px; right:8px; font-size:7px; color:#0f0; z-index:16; text-shadow:1px 1px 0 #000; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="bg-canvas" width="900" height="600"></canvas>
  <canvas id="game-canvas" width="900" height="600"></canvas>
  <canvas id="trail-canvas" width="900" height="600"></canvas>

  <div id="hud">
    <span>SCORE <span id="score-val">00000</span></span>
    <span>ROUND <span id="round-val">1</span></span>
    <span id="lives-display">♥♥♥</span>
  </div>
  <div id="cam-status">CAM: INIT</div>
  <div id="combo-display"><div id="combo-text"></div></div>

  <div id="cam-wrap">
    <video id="cam-video" playsinline muted autoplay></video>
    <canvas id="hand-canvas"></canvas>
  </div>

  <div id="round-flash"><h2 id="round-flash-text">ROUND 1</h2></div>

  <div id="overlay">
    <h1>🍉 FRUIT NINJA</h1>
    <p>HAND EDITION</p>
    <p class="sub">
      ✋ USE BOTH HANDS TO SLASH<br>
      🍎 SLICE PIXEL FRUITS = POINTS<br>
      💣 HIT A BOMB = LOSE A LIFE<br>
      COMBO SLICES = BONUS POINTS
    </p>
    <button id="start-btn">START GAME</button>
  </div>
</div>

// ── PIXEL FRUIT SPRITES ───────────────────────────────────────────────────────
// Each fruit: { name, colors, draw(ctx, x, y, r) }
const FRUITS = [
  // WATERMELON
  {
    name:'watermelon', pts:100,
    draw(ctx, x, y, r) {
      const s = r/24;
      ctx.save(); ctx.translate(x,y);
      // green rind
      ctx.fillStyle='#2d8a2d'; ctx.beginPath(); ctx.arc(0,0,r,Math.PI,2*Math.PI); ctx.fill();
      // red flesh
      ctx.fillStyle='#e03030'; ctx.beginPath(); ctx.arc(0,2*s,r-4*s,Math.PI,2*Math.PI); ctx.fill();
      // seeds
      ctx.fillStyle='#1a1a1a';
      [[-6*s,2*s],[0,4*s],[6*s,2*s]].forEach(([sx,sy])=>{
        ctx.beginPath(); ctx.ellipse(sx,sy,1.5*s,2.5*s,0,0,2*Math.PI); ctx.fill();
      });
      // green top arc
      ctx.strokeStyle='#1a6e1a'; ctx.lineWidth=3*s;
      ctx.beginPath(); ctx.arc(0,0,r,Math.PI,2*Math.PI); ctx.stroke();
      ctx.restore();
    }
  },
  // APPLE
  {
    name:'apple', pts:150,
    draw(ctx, x, y, r) {
      const s = r/24;
      ctx.save(); ctx.translate(x,y);
      ctx.fillStyle='#d92020';
      ctx.beginPath();
      ctx.moveTo(0,-r+4*s);
      ctx.bezierCurveTo(r+4*s,-r+4*s, r+6*s,r*0.5, 0,r);
      ctx.bezierCurveTo(-r-6*s,r*0.5, -r-4*s,-r+4*s, 0,-r+4*s);
      ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.18)';
      ctx.beginPath(); ctx.ellipse(-4*s,-4*s,5*s,8*s,-0.5,0,2*Math.PI); ctx.fill();
      // stem
      ctx.strokeStyle='#5a3010'; ctx.lineWidth=2*s;
      ctx.beginPath(); ctx.moveTo(0,-r+2*s); ctx.lineTo(3*s,-r-5*s); ctx.stroke();
      // leaf
      ctx.fillStyle='#2a8a2a';
      ctx.beginPath(); ctx.ellipse(5*s,-r-3*s,5*s,3*s,-0.4,0,2*Math.PI); ctx.fill();
      ctx.restore();
    }
  },
  // ORANGE
  {
    name:'orange', pts:120,
    draw(ctx, x, y, r) {
      const s = r/24;
      ctx.save(); ctx.translate(x,y);
      ctx.fillStyle='#f07020';
      ctx.beginPath(); ctx.arc(0,0,r,0,2*Math.PI); ctx.fill();
      ctx.strokeStyle='#c05810'; ctx.lineWidth=1.5*s;
      for(let a=0;a<6;a++){
        ctx.beginPath(); ctx.moveTo(0,0);
        ctx.lineTo(Math.cos(a*Math.PI/3)*r*0.8, Math.sin(a*Math.PI/3)*r*0.8);
        ctx.stroke();
      }
      ctx.fillStyle='rgba(255,255,255,0.2)';
      ctx.beginPath(); ctx.ellipse(-5*s,-5*s,6*s,9*s,-0.5,0,2*Math.PI); ctx.fill();
      ctx.strokeStyle='#5a3010'; ctx.lineWidth=2*s;
      ctx.beginPath(); ctx.moveTo(0,-r); ctx.lineTo(0,-r-5*s); ctx.stroke();
      ctx.restore();
    }
  },
  // BANANA
  {
    name:'banana', pts:130,
    draw(ctx, x, y, r) {
      const s = r/24;
      ctx.save(); ctx.translate(x,y);
      ctx.fillStyle='#f8d800';
      ctx.beginPath();
      ctx.moveTo(-r*0.7, r*0.3);
      ctx.quadraticCurveTo(0, -r*1.1, r*0.7, r*0.3);
      ctx.quadraticCurveTo(r*0.5, r*0.7, 0, r*0.5);
      ctx.quadraticCurveTo(-r*0.5, r*0.7, -r*0.7, r*0.3);
      ctx.fill();
      ctx.strokeStyle='#c8a800'; ctx.lineWidth=1.5*s;
      ctx.beginPath(); ctx.moveTo(-r*0.5,r*0.1); ctx.quadraticCurveTo(0,-r*0.9,r*0.5,r*0.1); ctx.stroke();
      ctx.restore();
    }
  },
  // PINEAPPLE
  {
    name:'pineapple', pts:200,
    draw(ctx, x, y, r) {
      const s = r/24;
      ctx.save(); ctx.translate(x,y);
      ctx.fillStyle='#e8b020';
      ctx.beginPath(); ctx.ellipse(0,4*s,r*0.7,r*0.95,0,0,2*Math.PI); ctx.fill();
      // diamond pattern
      ctx.strokeStyle='#8a5c10'; ctx.lineWidth=s;
      for(let row=-3;row<=3;row++) for(let col=-2;col<=2;col++){
        const px=col*8*s + (row%2)*4*s, py=row*8*s;
        ctx.beginPath(); ctx.rect(px-3*s, py-3*s, 6*s, 6*s); ctx.stroke();
      }
      // leaves
      ctx.fillStyle='#2a8a2a';
      [[-8*s,-r*0.5],[0,-r*0.9],[8*s,-r*0.5]].forEach(([lx,ly])=>{
        ctx.beginPath(); ctx.moveTo(0,-r*0.2);
        ctx.quadraticCurveTo(lx*0.5, (ly+(-r*0.2))*0.5, lx,ly);
        ctx.quadraticCurveTo(lx*1.3,(ly+(-r*0.2))*0.6,0,-r*0.2);
        ctx.fill();
      });
      ctx.restore();
    }
  },
  // LEMON
  {
    name:'lemon', pts:110,
    draw(ctx, x, y, r) {
      const s = r/24;
      ctx.save(); ctx.translate(x,y);
      ctx.fillStyle='#f8f020';
      ctx.beginPath(); ctx.ellipse(0,0,r*0.75,r,0,0,2*Math.PI); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.2)';
      ctx.beginPath(); ctx.ellipse(-4*s,-4*s,5*s,8*s,-0.3,0,2*Math.PI); ctx.fill();
      ctx.strokeStyle='#c8b800'; ctx.lineWidth=2*s;
      ctx.beginPath(); ctx.moveTo(0,-r); ctx.lineTo(0,-r-4*s); ctx.stroke();
      ctx.restore();
    }
  },
  // GRAPE
  {
    name:'grape', pts:160,
    draw(ctx, x, y, r) {
      const s = r/24;
      ctx.save(); ctx.translate(x,y);
      const positions = [[0,-r*0.55],[-r*0.45,r*0.05],[r*0.45,r*0.05],
                         [-r*0.2,r*0.55],[r*0.2,r*0.55],[0,r*1.0]];
      positions.forEach(([gx,gy])=>{
        ctx.fillStyle='#7820c8';
        ctx.beginPath(); ctx.arc(gx,gy,r*0.45,0,2*Math.PI); ctx.fill();
        ctx.fillStyle='rgba(255,255,255,0.25)';
        ctx.beginPath(); ctx.arc(gx-2*s,gy-2*s,r*0.15,0,2*Math.PI); ctx.fill();
      });
      ctx.strokeStyle='#3a1060'; ctx.lineWidth=1.5*s;
      ctx.beginPath(); ctx.moveTo(0,-r*0.9); ctx.lineTo(0,-r-5*s); ctx.stroke();
      ctx.restore();
    }
  },
  // STRAWBERRY
  {
    name:'strawberry', pts:140,
    draw(ctx, x, y, r) {
      const s = r/24;
      ctx.save(); ctx.translate(x,y);
      ctx.fillStyle='#e82828';
      ctx.beginPath();
      ctx.moveTo(0,r);
      ctx.bezierCurveTo(-r*1.1,r*0.4, -r*1.1,-r*0.3, 0,-r*0.5);
      ctx.bezierCurveTo(r*1.1,-r*0.3, r*1.1,r*0.4, 0,r);
      ctx.fill();
      // seeds
      ctx.fillStyle='#f8e800';
      for(let i=0;i<8;i++){
        const a = i/8*2*Math.PI;
        const sr = r*0.45;
        ctx.beginPath(); ctx.arc(Math.cos(a)*sr, Math.sin(a)*sr*0.6, 1.5*s,0,2*Math.PI); ctx.fill();
      }
      // leaves
      ctx.fillStyle='#2a8a2a';
      [[-5*s,-r*0.5],[0,-r*0.8],[5*s,-r*0.5]].forEach(([lx,ly])=>{
        ctx.beginPath(); ctx.ellipse(lx,ly,4*s,6*s,lx>0?0.5:-0.5,0,2*Math.PI); ctx.fill();
      });
      ctx.restore();
    }
  },
];

// ── ITEM CLASS ─────────────────────────────────────────────────────────────────
class Item {
  constructor(type) {
    this.type = type; // 'fruit' or 'bomb'
    this.x = 80 + Math.random() * (W - 160);
    this.y = H + 60;
    const speed = 7 + round * 0.4 + Math.random() * 3;
    const angle = (-Math.PI/2) + (Math.random()-0.5) * 1.0;
    this.vx = Math.cos(angle) * speed * 0.5;
    this.vy = -speed;
    this.gravity = 0.18 + round * 0.01;
    this.r = type === 'bomb' ? 34 : 26 + Math.random()*12;
    this.rot = Math.random() * Math.PI * 2;
    this.rotSpeed = (Math.random()-0.5)*0.08;
    this.sliced = false;
    this.opacity = 1;
    this.gone = false;
    if (type === 'fruit') {
      const idx = Math.floor(Math.random() * FRUITS.length);
      this.fruit = FRUITS[idx];
      this.pts = this.fruit.pts + round * 20;
    } else {
      this.bombImg = BOMB_IMGS[Math.floor(Math.random()*BOMB_IMGS.length)];
    }
    // sliced halves
    this.halves = null;
  }

  update(dt) {
    if (this.sliced) {
      if (this.halves) {
        this.halves.forEach(h => {
          h.x += h.vx * dt;
          h.y += h.vy * dt;
          h.vy += this.gravity * dt;
          h.rot += h.rotSpeed;
          h.opacity -= 0.025 * dt;
        });
        if (this.halves[0].opacity <= 0) this.gone = true;
      } else { this.gone = true; }
      return;
    }
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.vy += this.gravity * dt;
    this.rot += this.rotSpeed;
    if (this.y > H + 100) {
      this.gone = true;
      if (!this.sliced && this.type === 'fruit') {
        // missed fruit – slight life penalty after 3 misses handled externally
      }
    }
  }

  slice() {
    if (this.sliced) return;
    this.sliced = true;
    this.halves = [
      { x:this.x, y:this.y, vx:this.vx-2, vy:this.vy-1, rot:this.rot, rotSpeed:-0.1, opacity:1 },
      { x:this.x, y:this.y, vx:this.vx+2, vy:this.vy-1, rot:this.rot, rotSpeed:0.1, opacity:1 },
    ];
  }

  draw(ctx) {
    if (this.type === 'bomb') {
      this.drawBomb(ctx);
    } else {
      this.drawFruit(ctx);
    }
  }

  drawFruit(ctx) {
    if (!this.sliced) {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rot);
      this.fruit.draw(ctx, 0, 0, this.r);
      ctx.restore();
    } else if (this.halves) {
      this.halves.forEach((h, hi) => {
        if (h.opacity <= 0) return;
        ctx.save();
        ctx.globalAlpha = Math.max(0, h.opacity);
        ctx.translate(h.x, h.y);
        ctx.rotate(h.rot);
        ctx.beginPath();
        if (hi===0) { ctx.rect(-this.r*2, -this.r*2, this.r*2, this.r*4); }
        else         { ctx.rect(0,        -this.r*2, this.r*2, this.r*4); }
        ctx.clip();
        // Juice splatter
        ctx.fillStyle = this.fruit.name==='watermelon'?'rgba(220,40,40,0.7)':
                        this.fruit.name==='apple'?'rgba(200,30,30,0.6)':
                        this.fruit.name==='orange'?'rgba(240,120,20,0.6)':
                        this.fruit.name==='lemon'?'rgba(240,240,0,0.6)':
                        this.fruit.name==='grape'?'rgba(120,30,200,0.6)':
                        'rgba(255,180,30,0.6)';
        ctx.beginPath(); ctx.arc(0,0,this.r*1.3,0,2*Math.PI); ctx.fill();
        this.fruit.draw(ctx, 0, 0, this.r);
        ctx.restore();
      });
    }
  }

  drawBomb(ctx) {
    const img = this.bombImg;
    if (!img.complete || img.naturalWidth === 0) return;
    if (!this.sliced) {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rot);
      const sz = this.r * 2.2;
      // circular clip
      ctx.beginPath(); ctx.arc(0,0,this.r,0,2*Math.PI); ctx.clip();
      ctx.drawImage(img, -sz/2, -sz/2, sz, sz);
      // red ring
      ctx.restore();
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.strokeStyle='rgba(200,0,0,0.8)'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(0,0,this.r,0,2*Math.PI); ctx.stroke();
      // BOMB label
      ctx.fillStyle='rgba(0,0,0,0.6)';
      ctx.beginPath(); ctx.roundRect(-20, this.r-14, 40, 14, 4); ctx.fill();
      ctx.fillStyle='#f04040'; ctx.font='bold 8px "Press Start 2P",monospace';
      ctx.textAlign='center'; ctx.fillText('BOMB', 0, this.r-3);
      ctx.restore();
    } else if (this.halves) {
      // explosion flash
      this.halves.forEach((h,hi) => {
        if (h.opacity <= 0) return;
        ctx.save();
        ctx.globalAlpha = Math.max(0, h.opacity);
        ctx.translate(h.x, h.y);
        // expanding ring
        const exR = this.r * (2 - h.opacity);
        ctx.strokeStyle=`rgba(255,${Math.floor(100+100*h.opacity)},0,${h.opacity})`;
        ctx.lineWidth=4;
        ctx.beginPath(); ctx.arc(0,0,exR,0,2*Math.PI); ctx.stroke();
        ctx.fillStyle=`rgba(255,200,0,${h.opacity*0.4})`;
        ctx.beginPath(); ctx.arc(0,0,exR*0.6,0,2*Math.PI); ctx.fill();
        ctx.restore();
      });
    }
  }

  hitTest(hx, hy) {
    if (this.sliced || this.gone) return false;
    const d = Math.hypot(hx - this.x, hy - this.y);
    return d < this.r + 8;
  }
}

// ── TRAIL SYSTEM — clean glitter, no ghosting ───────────────────────────────
// Key fixes:
//  1. NO shadowBlur (causes bloom residue / ghosting) — use radial gradient instead
//  2. Batch draw by opacity bucket — no save/restore per particle
//  3. Tight spread (6px) so trail stays crisp on fingertip
//  4. Life decays fast (~0.7s) with smooth alpha

const glitters = [];
const TRAIL_COLORS = [
  { core:'#ffffff', glow:'#aaddff' },  // hand 0: icy white
  { core:'#ffe060', glow:'#ff9900' },  // hand 1: gold
];

function addTrailPoint(hx, hy, handIdx) {
  const col = TRAIL_COLORS[handIdx % TRAIL_COLORS.length];
  // Core bright dot on exact fingertip
  glitters.push({ x:hx, y:hy, vx:0, vy:0, r:4, core:col.core, glow:col.glow, life:1.0, isCore:true });
  // Scatter sparkles
  for (let i=0; i<7; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd   = 0.5 + Math.random() * 2.5;
    glitters.push({
      x: hx + (Math.random()-0.5)*6,
      y: hy + (Math.random()-0.5)*6,
      vx: Math.cos(angle)*spd,
      vy: Math.sin(angle)*spd - 0.8,
      r: 0.8 + Math.random()*2.5,
      core: col.core, glow: col.glow,
      life: 0.7 + Math.random()*0.3,
      isCore: false,
    });
  }
}

function updateTrail(dt) {
  for (let i = glitters.length-1; i >= 0; i--) {
    const g = glitters[i];
    g.x  += g.vx * dt;
    g.y  += g.vy * dt;
    g.vy += 0.04 * dt;
    // core dots fade slower, sparkles faster
    g.life -= (g.isCore ? 0.045 : 0.06) * dt;
    if (g.life <= 0) { glitters.splice(i,1); }
  }
}

function drawTrail() {
  // Full clear each frame — no accumulation = no ghosting
  trailCtx.clearRect(0, 0, W, H);

  // Draw sparkles first (below cores)
  glitters.forEach(g => {
    if (g.isCore) return;
    const alpha = Math.max(0, g.life);
    // Radial gradient for glow look without shadowBlur
    const grad = trailCtx.createRadialGradient(g.x, g.y, 0, g.x, g.y, g.r * 2.5);
    grad.addColorStop(0, g.core + Math.round(alpha*255).toString(16).padStart(2,'0'));
    grad.addColorStop(0.4, g.glow + Math.round(alpha*160).toString(16).padStart(2,'0'));
    grad.addColorStop(1, g.glow + '00');
    trailCtx.globalAlpha = 1; // alpha baked into gradient
    trailCtx.fillStyle = grad;
    trailCtx.beginPath();
    trailCtx.arc(g.x, g.y, g.r * 2.5, 0, Math.PI * 2);
    trailCtx.fill();
  });

  // Draw core bright dots on top
  glitters.forEach(g => {
    if (!g.isCore) return;
    const alpha = Math.max(0, g.life);
    trailCtx.globalAlpha = alpha;
    trailCtx.fillStyle = g.core;
    trailCtx.beginPath();
    trailCtx.arc(g.x, g.y, g.r, 0, Math.PI * 2);
    trailCtx.fill();
  });

  trailCtx.globalAlpha = 1;
}

// ── HAND TRACKING — smoothed, stable, no ghosting ───────────────────────────
const MAX_HANDS = 2;

// Smoothed world positions per stable hand slot
const smoothedPos = Array.from({length:MAX_HANDS}, ()=>({x:-999,y:-999,active:false}));
// History for slash detection (after smoothing)
const handHistory = Array.from({length:MAX_HANDS}, ()=>[]);
const HISTORY_LEN = 6;
const SLASH_DIST  = 14;   // px movement threshold to register a slash
const SMOOTH_K    = 0.55; // exponential smoothing: 0=frozen, 1=raw (0.55 = responsive but smooth)

// Extract stable blade point: middle of index+middle+ring tips
// These 3 fingers move together during slashing — much more stable than just tip 8
function getBladePoint(lm) {
  const pts = [lm[8], lm[12], lm[16]]; // index, middle, ring tips
  return {
    x: (1 - (pts[0].x + pts[1].x + pts[2].x)/3) * W,
    y:      (pts[0].y + pts[1].y + pts[2].y)/3  * H,
  };
}

// Match incoming MediaPipe hand array to stable slots by proximity
// This prevents trail-jump when MediaPipe swaps hand order between frames
function matchHandsToSlots(rawHands) {
  // rawHands: [{x,y}] positions, up to 2
  // Returns: slot index for each rawHand
  if (rawHands.length === 0) return [];
  if (rawHands.length === 1) {
    // Assign to nearest active slot, or slot 0 if none active
    let best = 0, bestD = Infinity;
    for (let s=0; s<MAX_HANDS; s++) {
      if (!smoothedPos[s].active) continue;
      const d = Math.hypot(rawHands[0].x - smoothedPos[s].x, rawHands[0].y - smoothedPos[s].y);
      if (d < bestD) { bestD=d; best=s; }
    }
    return [best];
  }
  // 2 hands: Hungarian-style for 2x2 — just try both assignments
  const a = Math.hypot(rawHands[0].x-smoothedPos[0].x,rawHands[0].y-smoothedPos[0].y)
          + Math.hypot(rawHands[1].x-smoothedPos[1].x,rawHands[1].y-smoothedPos[1].y);
  const b = Math.hypot(rawHands[0].x-smoothedPos[1].x,rawHands[0].y-smoothedPos[1].y)
          + Math.hypot(rawHands[1].x-smoothedPos[0].x,rawHands[1].y-smoothedPos[0].y);
  return a <= b ? [0,1] : [1,0];
}

function processHandSlash(slotIdx, x, y) {
  const hist = handHistory[slotIdx];
  hist.push({x,y});
  if (hist.length > HISTORY_LEN) hist.shift();

  addTrailPoint(x, y, slotIdx);

  if (hist.length < 2) return;
  const prev = hist[hist.length-2];
  const dist = Math.hypot(x-prev.x, y-prev.y);
  if (dist < SLASH_DIST) return;

  // Sweep all points along segment at step intervals for accuracy
  const steps = Math.max(1, Math.floor(dist/12));
  let hitThisFrame = 0;
  for (const item of items) {
    if (item.sliced || item.gone) continue;
    let hit = false;
    for (let s=0; s<=steps && !hit; s++) {
      const t = s/steps;
      const sx = prev.x + (x-prev.x)*t;
      const sy = prev.y + (y-prev.y)*t;
      if (Math.hypot(sx-item.x, sy-item.y) < item.r + 8) hit = true;
    }
    if (!hit) {
      // also segment distance test as fallback
      const d = pointLineDist(item.x, item.y, prev.x, prev.y, x, y);
      if (d < item.r + 8) hit = true;
    }
    if (hit) {
      if (item.type === 'fruit') {
        item.slice();
        score += item.pts;
        scoreVal.textContent = String(score).padStart(5,'0');
        hitThisFrame++;
        showScorePop(item.x, item.y, '+'+item.pts);
        spawnJuice(item.x, item.y, item.fruit);
      } else {
        item.slice();
        loseLife();
        showBombFlash();
      }
    }
  }

  if (hitThisFrame > 0) {
    combo += hitThisFrame;
    comboTimer = 90;
    const bonus = combo >= 3 ? combo * 50 : 0;
    if (bonus > 0) {
      score += bonus;
      scoreVal.textContent = String(score).padStart(5,'0');
    }
    if (combo >= 3) showCombo(combo, bonus);
  }
}

function pointLineDist(px,py,ax,ay,bx,by) {
  const dx=bx-ax, dy=by-ay;
  const lenSq = dx*dx+dy*dy;
  if (lenSq===0) return Math.hypot(px-ax,py-ay);
  let t = ((px-ax)*dx+(py-ay)*dy)/lenSq;
  t = Math.max(0,Math.min(1,t));
  return Math.hypot(px-(ax+t*dx), py-(ay+t*dy));
}

// ── JUICE PARTICLES ───────────────────────────────────────────────────────────
const juiceParticles = [];
function spawnJuice(x, y, fruit) {
  const col = fruit.name==='watermelon'?'#e03030':
              fruit.name==='apple'?'#d02020':
              fruit.name==='orange'?'#f07020':
              fruit.name==='lemon'?'#f8f020':
              fruit.name==='grape'?'#7820c8':
              fruit.name==='strawberry'?'#e82828':'#f8d800';
  for (let i=0;i<20;i++) {
    const a = Math.random()*2*Math.PI;
    const spd = 2+Math.random()*5;
    juiceParticles.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd-2,
      r:2+Math.random()*4, color:col, life:1.0});
  }
}

function updateJuice(dt) {
  for (let i=juiceParticles.length-1;i>=0;i--){
    const p=juiceParticles[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=0.15*dt;
    p.life-=0.02*dt;
    if(p.life<=0) juiceParticles.splice(i,1);
  }
}

function drawJuice(ctx) {
  juiceParticles.forEach(p=>{
    ctx.save();
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,2*Math.PI); ctx.fill();
    ctx.restore();
  });
}

// ── LIVES ─────────────────────────────────────────────────────────────────────
function loseLife() {
  lives = Math.max(0, lives-1);
  updateLives();
  if (lives <= 0) endGame();
}

// ── ROUND MANAGEMENT ─────────────────────────────────────────────────────────
function startRound() {
  state='playing';
  items=[];
  lastSpawn=0;
  roundStartTime=Date.now();
  roundOver=false;
  missedFruits=0;
  roundVal.textContent=round;
  overlay.style.display='none';
  roundFlash.style.display='none';
  combo=0; comboTimer=0;
}

function showRoundFlash(txt, cb) {
  roundFlashText.textContent=txt;
  roundFlash.style.display='flex';
  setTimeout(()=>{ roundFlash.style.display='none'; cb && cb(); }, 1400);
}

function nextRound() {
  round++;
  if (round > totalRounds) { endGame(true); return; }
  showRoundFlash(`ROUND ${round}`, ()=>startRound());
}

function endGame(won=false) {
  state='gameover';
  overlay.style.display='flex';
  overlay.innerHTML = `
    <h1>${won?'🏆 WINNER!':'💀 GAME OVER'}</h1>
    <p>FINAL SCORE: ${String(score).padStart(5,'0')}</p>
    <p>ROUND ${round} / ${totalRounds}</p>
    <button id="start-btn" onclick="resetGame()" style="padding:12px 28px;background:#b84000;color:#fff;border:3px solid #f8d060;font-family:'Press Start 2P',monospace;font-size:9px;cursor:pointer;box-shadow:4px 4px 0 #000;margin-top:14px;">PLAY AGAIN</button>
  `;
}

function resetGame() {
  score=0; round=1; lives=3; combo=0; comboTimer=0;
  items=[]; juiceParticles.length=0; glitters.length=0;
  scoreVal.textContent='00000';
  updateLives();
  overlay.innerHTML = ''; // will be restored by startRound flow
  showRoundFlash('ROUND 1', ()=>startRound());
}

// ── MAIN LOOP ─────────────────────────────────────────────────────────────────
let lastT = 0;
function tick(ts) {
  const dt = Math.min((ts-lastT)/16.667, 3);
  lastT = ts;

  gameCtx.clearRect(0,0,W,H);
  // Re-draw bg each frame (lazy - only draw once into bgCanvas on load)

  if (state==='playing') {
    const elapsed = (Date.now() - roundStartTime) / 1000;

    // Spawn
    const spawnInterval = Math.max(700, 1400 - round * 80);
    if (ts - lastSpawn > spawnInterval) {
      spawnItem();
      lastSpawn = ts;
    }

    // Combo decay
    if (comboTimer > 0) { comboTimer -= dt; }
    else if (combo > 0) { combo = 0; }

    // Update items
    let fruitsOnScreen = 0;
    for (let i=items.length-1;i>=0;i--) {
      const item=items[i];
      item.update(dt);
      if (item.gone) {
        if (!item.sliced && item.type==='fruit') {
          missedFruits++;
          if (missedFruits >= MISS_PENALTY) { missedFruits=0; loseLife(); }
        }
        items.splice(i,1);
      }
      if (!item.sliced && item.type==='fruit') fruitsOnScreen++;
    }

    // Draw items
    items.forEach(it=>it.draw(gameCtx));
    updateJuice(dt);
    drawJuice(gameCtx);

    // Round end
    if (elapsed > ROUND_DURATION && !roundOver) {
      roundOver=true;
      setTimeout(()=>nextRound(), 1200);
    }
  }

  // Trail
  updateTrail(dt);
  drawTrail();

  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// ── MEDIAPIPE HANDS ───────────────────────────────────────────────────────────
const camVideo = document.getElementById('cam-video');
let handsDetected = 0;

function dist2D(a,b) { return Math.hypot(a.x-b.x,a.y-b.y); }

function getLandmarkPos(lm) {
  // Mirrored X (cam is CSS-mirrored), map to canvas coords
  return {
    x: (1 - lm.x) * W,
    y: lm.y * H
  };
}

function onHandResults(results) {
  handCtx.clearRect(0, 0, 110, 82);

  if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
    camStatus.textContent = 'CAM: NO HAND';
    camStatus.style.color = '#f88';
    handsDetected = 0;
    // Mark all slots inactive
    smoothedPos.forEach(s => { s.active = false; });
    handHistory.forEach(h => h.length = 0);
    return;
  }

  handsDetected = results.multiHandLandmarks.length;
  camStatus.textContent = `CAM: ${handsDetected} HAND${handsDetected>1?'S':''}`;
  camStatus.style.color = '#0f0';

  // Get raw blade points for all detected hands
  const rawPoints = results.multiHandLandmarks.map(lm => getBladePoint(lm));

  // Match to stable slots
  const slotAssignment = matchHandsToSlots(rawPoints);

  // Update smoothed positions and process slashes
  slotAssignment.forEach((slotIdx, i) => {
    const raw = rawPoints[i];
    const sp  = smoothedPos[slotIdx];

    let sx, sy;
    if (!sp.active) {
      // First frame for this slot — snap directly, no smoothing
      sx = raw.x; sy = raw.y;
    } else {
      // Exponential smoothing: new = old + K*(raw-old)
      sx = sp.x + SMOOTH_K * (raw.x - sp.x);
      sy = sp.y + SMOOTH_K * (raw.y - sp.y);
    }

    sp.x = sx; sp.y = sy; sp.active = true;

    if (state === 'playing') {
      processHandSlash(slotIdx, sx, sy);
    } else {
      addTrailPoint(sx, sy, slotIdx);
    }

    drawMiniSkeleton(results.multiHandLandmarks[i], slotIdx);
  });

  // Deactivate unused slots
  for (let s = 0; s < MAX_HANDS; s++) {
    if (!slotAssignment.includes(s)) {
      smoothedPos[s].active = false;
      handHistory[s].length = 0;
    }
  }
}

function drawMiniSkeleton(lm, hi) {
  const W2=110, H2=82;
  const cols=['rgba(255,255,255,0.8)','rgba(255,200,50,0.8)'];
  handCtx.strokeStyle = cols[hi%2];
  handCtx.lineWidth=1.2;
  const connections=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],
    [0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],
    [0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]];
  connections.forEach(([a,b])=>{
    const la=lm[a], lb=lm[b];
    handCtx.beginPath();
    // Note: cam is CSS mirrored, so draw unmirrored here
    handCtx.moveTo((1-la.x)*W2, la.y*H2);
    handCtx.lineTo((1-lb.x)*W2, lb.y*H2);
    handCtx.stroke();
  });
}

async function initCamera() {
  try {
    const hands = new Hands({
      locateFile: f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
    });
    hands.setOptions({
      maxNumHands:2, modelComplexity:1,
      minDetectionConfidence:0.7, minTrackingConfidence:0.65
    });
    hands.onResults(onHandResults);
    const camera = new Camera(camVideo, {
      onFrame: async()=>{ await hands.send({image:camVideo}); },
      width:320, height:240
    });
    await camera.start();
    camStatus.textContent='CAM: ACTIVE';
    camStatus.style.color='#0f0';
  } catch(e) {
    camStatus.textContent='CAM: DENIED';
    camStatus.style.color='#f44';
  }
}

// Mouse slash fallback
let lastMouse = null;
document.getElementById('wrap').addEventListener('mousemove', e=>{
  if (handsDetected > 0) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const mx = (e.clientX-rect.left)*(W/rect.width);
  const my = (e.clientY-rect.top)*(H/rect.height);
  addTrailPoint(mx, my, 0);
  if (lastMouse && state==='playing') {
    const d = Math.hypot(mx-lastMouse.x, my-lastMouse.y);
    if (d > 8) processHandSlash(0, mx, my);
  }
  lastMouse = {x:mx,y:my};
});

// Start button
document.getElementById('start-btn').addEventListener('click', ()=>{
  showRoundFlash('ROUND 1', ()=>startRound());
  initCamera();
});
</script>
